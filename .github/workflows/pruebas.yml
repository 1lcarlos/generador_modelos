name: Pruebas

on:
  push:
    branches: [master, "version-*"]
  pull_request:

jobs:
  pruebas:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    defaults:
      run:
        working-directory: windows_version
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Dependencias (sin PySide6: las pruebas cubren el nucleo y el CLI)
        run: python -m pip install pytest psycopg2-binary keyring
      - name: Compilar todo el paquete (incluida la interfaz)
        run: python -m compileall -q ladm_admin
      - name: Pruebas unitarias
        run: python -m pytest tests -q
